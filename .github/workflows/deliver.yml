name: Deliver White Guard intro preview
on:
  push:
    branches: [preview/white-guard-intro-downloads]
    paths: [delivery-ready.json]
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and verify the viewing files
        run: python3 assemble.py
      - name: Upload preview downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload white-guard-intro-staged dist/White-Guard-Intro.mp4 dist/White-Guard-Intro-Browser.zip dist/White-Guard-Intro.srt dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit white-guard-intro-staged --draft=false --prerelease --latest=false --repo "$GITHUB_REPOSITORY"
