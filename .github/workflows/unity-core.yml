name: Unity portable core parity
on:
  push:
    paths: ["unity/**", ".github/workflows/unity-core.yml"]
  pull_request:
    paths: ["unity/**", ".github/workflows/unity-core.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.404'
      - name: Verify original media and package wiring
        run: python3 unity/Tools/validate_layout.py
      - name: Compare C# models with Godot execution snapshot
        run: python3 unity/Tools/check_core.py --report /tmp/unity-core-parity.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portable-core-parity-not-unity-editor
          path: /tmp/unity-core-parity.json
